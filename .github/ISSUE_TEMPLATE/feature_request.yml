name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前做不到或不方便的地方
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 组件、composables、配置项或行为的设想
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代做法
      description: 是否已通过原生 maplibre-gl API 或自定义图层等方式绕过
