name: 问题反馈
description: 报告 @movk/maplibre 的缺陷
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: '@movk/maplibre 版本'
      placeholder: 1.3.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 接入方式（Nuxt 模块 / Vue + Vite）、maplibre-gl 版本、Node.js 版本、浏览器
      placeholder: Nuxt 4.6.2、maplibre-gl 6.13.0、Node 24.1.0、Chrome 140
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: 复现仓库
      description: 最小可复现的仓库或 StackBlitz 链接
      placeholder: https://github.com/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 复现步骤、期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 控制台或构建报错输出，粘贴前请移除天地图 token 等密钥
      render: text
