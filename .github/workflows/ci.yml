name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test run

      - name: Build
        run: pnpm run build

      - name: Build Vue playground
        run: pnpm run dev:vue:build

      - name: Publish preview
        run: pnpx pkg-pr-new publish --compact --no-template --pnpm

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      # 生产构建显式启用 AI Chat，密钥仅在 Worker 运行时配置；显式 bash 启用 pipefail，避免 tee 吞掉构建失败
      - name: Build docs
        shell: bash
        env:
          NUXT_GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run docs:build 2>&1 | tee build.log

      - name: Check prerender errors
        run: "! grep '\\[request error\\]' build.log"

      - name: Validate Worker bundle
        run: pnpm --dir docs exec wrangler deploy --dry-run
